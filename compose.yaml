services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: mc
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"  # снаружи дял подключения 25565, внутри контейнера 25565
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "26.3"
      ONLINE_MODE: "FALSE"
      MEMORY: "2G"
      MAX_PLAYERS: "666"
      MOTD: "Выживание"
      ENABLE_RCON: "false"
    volumes:
      - ./data:/data
    stop_grace_period: 1m

